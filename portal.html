<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ADA — Portal Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=MedievalSharp&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="portal">
  <main class="app">
    <header class="app__header">
      <div class="app__header-main">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true"></div>
          <div>
            <h1>ADA</h1>
            <p>The Portal Hub — three pillars, one destiny.</p>
          </div>
        </div>
      </div>
      <div class="app__header-user">
        <span id="currentUserLabel" class="user-label" hidden></span>
        <nav id="appNav" class="nav" aria-label="Primary">
          <a class="nav__link" href="portal.html">Portal</a>
          <a class="nav__link" href="vault.html">My Characters</a>
          <a class="nav__link" href="hall.html">Hall of Records</a>
          <a class="nav__link" href="profile.html">Profile</a>
          <button type="button" class="nav__link nav__link--danger" id="logoutBtn">Logout</button>
        </nav>
      </div>
    </header>

    <section class="view">
      <div class="card">
        <header class="portal-header">
          <h2>The Portal</h2>
          <p class="text-muted">Choose your journey: solo sagas, human lobbies, or world mastery.</p>
        </header>

        <div class="portal-grid" role="list">
          <button type="button" id="portalSoloBtn" class="portal-card" role="listitem">
            <div class="portal-card__badge">AI Sagas</div>
            <h3 class="portal-card__title">Venture Alone</h3>
            <p class="portal-card__desc">Enter ADA-led solo adventures — fast, cinematic, and ruthless (in a fun way).</p>
          </button>

          <button type="button" id="portalLobbiesBtn" class="portal-card" role="listitem">
            <div class="portal-card__badge">Human Lobbies</div>
            <h3 class="portal-card__title">Join a Party</h3>
            <p class="portal-card__desc">Browse tavern lobbies, request entry, and coordinate in OOC chat.</p>
          </button>

          <button type="button" id="portalStudioBtn" class="portal-card" role="listitem">
            <div class="portal-card__badge">Architect’s Studio</div>
            <h3 class="portal-card__title">Master a World</h3>
            <p class="portal-card__desc">Build campaigns, import scenarios from the Hall, and publish your own legends.</p>
          </button>
        </div>

        <div class="portal-links">
          <a class="link-btn" href="hall.html">Browse the Hall of Records →</a>
        </div>
      </div>
    </section>
  </main>

  <script src="speech.js"></script>
</body>
</html>
